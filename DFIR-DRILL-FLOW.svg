<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', sans-serif">
  <!-- BG -->
  <rect width="1800" height="950" fill="#f7f5f0"/>

  <!-- Top eyebrow + title -->
  <g transform="translate(60,50)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#2f6f5e18"/>
    <text x="110" y="19" text-anchor="middle" font-size="11" fill="#2f6f5e" font-family="JetBrains Mono, monospace" letter-spacing="1.5">DFIR DRILL · KAPE-MEDIA v5.2.14</text>
    <text x="0" y="68" font-size="34" fill="#14171e" font-weight="600">Flujo de adquisición forense sobre VMware</text>
    <text x="0" y="100" font-size="14" fill="#7c7a72">El disco DFIR-OUTPUT.vmdk viaja entre VMs como contenedor forense. Red aislada durante captura. Cadena de custodia intacta.</text>
  </g>

  <!-- 4 stage cards -->
  <!-- Stage geometry: width=380, height=560, gap=40, start=60 -->
  <!-- Colors: s1=#b06367 (danger), s2=#c97b3f (warn), s3=#2f6f5e (primary), s4=#3a4256 -->

  <!-- ARROWS between stages (drawn first so cards overlap if needed) -->
  <g stroke="#7c7a72" stroke-width="2" fill="none">
    <line x1="460" y1="450" x2="500" y2="450"/>
    <polygon points="500,450 490,444 490,456" fill="#7c7a72" stroke="none"/>
    <line x1="880" y1="450" x2="920" y2="450"/>
    <polygon points="920,450 910,444 910,456" fill="#7c7a72" stroke="none"/>
    <line x1="1300" y1="450" x2="1340" y2="450"/>
    <polygon points="1340,450 1330,444 1330,456" fill="#7c7a72" stroke="none"/>
  </g>

  <!-- STAGE 1: Adquisición -->
  <g transform="translate(60,170)">
    <rect x="0" y="0" width="400" height="580" rx="14" fill="#ffffff" stroke="#e9e3d6" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="6" rx="14" fill="#b06367"/>

    <text x="20" y="38" font-size="10" font-family="JetBrains Mono, monospace" fill="#b06367" letter-spacing="1.5">ETAPA 1</text>
    <text x="20" y="68" font-size="22" fill="#14171e" font-weight="600">Adquisición</text>
    <text x="20" y="92" font-size="12" fill="#7c7a72">VM Windows afectada · red aislada</text>

    <!-- VM card -->
    <rect x="20" y="115" width="360" height="155" rx="8" fill="#f7f5f0" stroke="#d6cfbf"/>
    <!-- Monitor icon -->
    <g transform="translate(36,135)" stroke="#14171e" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="22" height="16" rx="2"/>
      <path d="M8 22h6M11 16v6"/>
    </g>
    <text x="68" y="148" font-size="13" font-weight="600" fill="#14171e">VM-A (infectada)</text>
    <text x="36" y="178" font-size="11" fill="#3a4256" font-family="JetBrains Mono, monospace">ide1:0 → KAPE-MEDIA-v5.2.14.iso</text>
    <text x="36" y="198" font-size="11" fill="#3a4256" font-family="JetBrains Mono, monospace">scsi0:1 → DFIR-OUTPUT.vmdk (16 GB)</text>
    <text x="36" y="218" font-size="11" fill="#3a4256">Label NTFS: DFIR_OUTPUT</text>
    <text x="36" y="238" font-size="11" fill="#b06367">NIC: desconectada</text>

    <!-- disk badge -->
    <rect x="36" y="248" width="100" height="18" rx="4" fill="#2f6f5e18"/>
    <text x="86" y="261" text-anchor="middle" font-size="10" font-family="JetBrains Mono, monospace" fill="#2f6f5e">E:\ DFIR_OUTPUT</text>

    <!-- Steps -->
    <g transform="translate(0,300)">
      <circle cx="30" cy="20" r="11" fill="#b06367"/>
      <text x="30" y="24" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">1</text>
      <text x="50" y="18" font-size="12" fill="#14171e" font-weight="600">RAM primero</text>
      <text x="50" y="34" font-size="11" fill="#3a4256">RAM_CAPTURE_UI.exe → E:\RAM-{HOST}.raw</text>

      <circle cx="30" cy="80" r="11" fill="#b06367"/>
      <text x="30" y="84" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">2</text>
      <text x="50" y="78" font-size="12" fill="#14171e" font-weight="600">KapeTriage</text>
      <text x="50" y="94" font-size="11" fill="#3a4256">KAPE_TRIAGE_UI.exe → ZIP ~800 MB</text>

      <circle cx="30" cy="140" r="11" fill="#b06367"/>
      <text x="30" y="144" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">3</text>
      <text x="50" y="138" font-size="12" fill="#14171e" font-weight="600">Notas + observación</text>
      <text x="50" y="154" font-size="11" fill="#3a4256">ransom note, ext, wallpaper → E:\NOTES\</text>

      <circle cx="30" cy="200" r="11" fill="#b06367"/>
      <text x="30" y="204" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">4</text>
      <text x="50" y="198" font-size="12" fill="#14171e" font-weight="600">Shutdown limpio</text>
      <text x="50" y="214" font-size="11" fill="#3a4256">Guest OS → no power-off</text>
    </g>
  </g>

  <!-- STAGE 2: Movimiento -->
  <g transform="translate(500,170)">
    <rect x="0" y="0" width="400" height="580" rx="14" fill="#ffffff" stroke="#e9e3d6" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="6" rx="14" fill="#c97b3f"/>

    <text x="20" y="38" font-size="10" font-family="JetBrains Mono, monospace" fill="#c97b3f" letter-spacing="1.5">ETAPA 2</text>
    <text x="20" y="68" font-size="22" fill="#14171e" font-weight="600">Movimiento</text>
    <text x="20" y="92" font-size="12" fill="#7c7a72">vCenter / ESXi · operación atómica</text>

    <!-- VM-A shutdown card -->
    <rect x="20" y="115" width="360" height="135" rx="8" fill="#f7f5f0" stroke="#d6cfbf"/>
    <g transform="translate(36,135)" stroke="#14171e" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="22" height="16" rx="2"/>
      <path d="M8 22h6M11 16v6"/>
    </g>
    <text x="68" y="148" font-size="13" font-weight="600" fill="#14171e">VM-A · shutdown</text>
    <text x="36" y="178" font-size="11" fill="#3a4256" font-family="JetBrains Mono, monospace">vim-cmd vmsvc/power.shutdown &lt;vmid&gt;</text>
    <text x="36" y="198" font-size="11" fill="#3a4256">Esperar poweredOff</text>
    <text x="36" y="218" font-size="11" fill="#c97b3f">NUNCA power-off forzado</text>
    <text x="36" y="234" font-size="10" fill="#7c7a72" font-style="italic">(ensucia journal NTFS)</text>

    <!-- VMDK move card -->
    <rect x="20" y="265" width="360" height="135" rx="8" fill="#f7f5f0" stroke="#d6cfbf"/>
    <g transform="translate(36,285)" stroke="#14171e" stroke-width="1.8" fill="none">
      <path d="M3 8h18M3 8l4-4M3 8l4 4M21 16H3M21 16l-4-4M21 16l-4 4"/>
    </g>
    <text x="68" y="298" font-size="13" font-weight="600" fill="#14171e">DFIR-OUTPUT.vmdk</text>
    <text x="36" y="328" font-size="11" fill="#3a4256" font-family="JetBrains Mono, monospace">Edit Settings → SCSI(0:1) → Remove</text>
    <text x="36" y="348" font-size="11" fill="#3a4256">Remover "from VM", NO "Delete"</text>
    <text x="36" y="368" font-size="11" fill="#2f6f5e">VMDK intacto en datastore</text>
    <text x="36" y="384" font-size="10" fill="#7c7a72" font-style="italic">(preserva $MFT, $LogFile, ADS)</text>

    <!-- Snapshot defensivo -->
    <g transform="translate(0,420)">
      <circle cx="30" cy="20" r="11" fill="#c97b3f"/>
      <text x="30" y="24" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">A</text>
      <text x="50" y="18" font-size="12" fill="#14171e" font-weight="600">Snapshot defensivo (opcional)</text>
      <text x="50" y="34" font-size="11" fill="#3a4256">Snapshot de VM-A antes de mover disco</text>

      <circle cx="30" cy="80" r="11" fill="#c97b3f"/>
      <text x="30" y="84" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">B</text>
      <text x="50" y="78" font-size="12" fill="#14171e" font-weight="600">Snapshot de VM-B antes de attach</text>
      <text x="50" y="94" font-size="11" fill="#3a4256">VM forense queda limpia para próximo caso</text>
    </g>
  </g>

  <!-- STAGE 3: Análisis -->
  <g transform="translate(940,170)">
    <rect x="0" y="0" width="400" height="580" rx="14" fill="#ffffff" stroke="#e9e3d6" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="6" rx="14" fill="#2f6f5e"/>

    <text x="20" y="38" font-size="10" font-family="JetBrains Mono, monospace" fill="#2f6f5e" letter-spacing="1.5">ETAPA 3</text>
    <text x="20" y="68" font-size="22" fill="#14171e" font-weight="600">Análisis</text>
    <text x="20" y="92" font-size="12" fill="#7c7a72">VM forense · red opcional (read-only)</text>

    <!-- VM-B card -->
    <rect x="20" y="115" width="360" height="155" rx="8" fill="#f7f5f0" stroke="#d6cfbf"/>
    <g transform="translate(36,135)" stroke="#14171e" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="22" height="16" rx="2"/>
      <path d="M8 22h6M11 16v6"/>
    </g>
    <text x="68" y="148" font-size="13" font-weight="600" fill="#14171e">VM-B (forense)</text>
    <text x="36" y="178" font-size="11" fill="#3a4256" font-family="JetBrains Mono, monospace">ide1:0 → KAPE-MEDIA-v5.2.14.iso</text>
    <text x="36" y="198" font-size="11" fill="#3a4256" font-family="JetBrains Mono, monospace">scsi0:1 → DFIR-OUTPUT.vmdk re-attach</text>
    <text x="36" y="218" font-size="11" fill="#3a4256">Mismo ISO: Tools\kape.zip + docs</text>
    <text x="36" y="238" font-size="11" fill="#2f6f5e">NIC: opcional (read-only)</text>

    <rect x="36" y="248" width="100" height="18" rx="4" fill="#2f6f5e18"/>
    <text x="86" y="261" text-anchor="middle" font-size="10" font-family="JetBrains Mono, monospace" fill="#2f6f5e">E:\ DFIR_OUTPUT</text>

    <!-- Steps -->
    <g transform="translate(0,300)">
      <circle cx="30" cy="20" r="11" fill="#2f6f5e"/>
      <text x="30" y="24" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">1</text>
      <text x="50" y="18" font-size="12" fill="#14171e" font-weight="600">Mount read-only</text>
      <text x="50" y="34" font-size="11" fill="#3a4256">Arsenal Image Mounter / FTK Imager</text>

      <circle cx="30" cy="80" r="11" fill="#2f6f5e"/>
      <text x="30" y="84" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">2</text>
      <text x="50" y="78" font-size="12" fill="#14171e" font-weight="600">Verificar hashes</text>
      <text x="50" y="94" font-size="11" fill="#3a4256">Get-FileHash contra .sha256 companion</text>

      <circle cx="30" cy="140" r="11" fill="#2f6f5e"/>
      <text x="30" y="144" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">3</text>
      <text x="50" y="138" font-size="12" fill="#14171e" font-weight="600">Análisis con Tools\kape.zip</text>
      <text x="50" y="154" font-size="11" fill="#3a4256">EvtxECmd, MFTECmd, PECmd, Amcache</text>

      <circle cx="30" cy="200" r="11" fill="#2f6f5e"/>
      <text x="30" y="204" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">4</text>
      <text x="50" y="198" font-size="12" fill="#14171e" font-weight="600">Volatility sobre RAM.raw</text>
      <text x="50" y="214" font-size="11" fill="#3a4256">Procesos, conexiones, credenciales</text>
    </g>
  </g>

  <!-- STAGE 4: Entrega -->
  <g transform="translate(1380,170)">
    <rect x="0" y="0" width="360" height="580" rx="14" fill="#ffffff" stroke="#e9e3d6" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="6" rx="14" fill="#3a4256"/>

    <text x="20" y="38" font-size="10" font-family="JetBrains Mono, monospace" fill="#3a4256" letter-spacing="1.5">ETAPA 4</text>
    <text x="20" y="68" font-size="22" fill="#14171e" font-weight="600">Entrega</text>
    <text x="20" y="92" font-size="12" fill="#7c7a72">Storage o VM de custodia · red abierta</text>

    <!-- Opción A -->
    <rect x="20" y="115" width="320" height="135" rx="8" fill="#f7f5f0" stroke="#d6cfbf"/>
    <g transform="translate(36,135)" stroke="#14171e" stroke-width="1.8" fill="none">
      <ellipse cx="11" cy="5" rx="9" ry="3"/>
      <path d="M2 5v14a9 3 0 0 0 18 0V5"/>
    </g>
    <text x="68" y="148" font-size="13" font-weight="600" fill="#14171e">Opción A · Datastore</text>
    <text x="36" y="178" font-size="11" fill="#3a4256" font-family="JetBrains Mono, monospace">cp *.vmdk datastore-IR/</text>
    <text x="36" y="198" font-size="11" fill="#3a4256">vCenter Storage vMotion</text>
    <text x="36" y="218" font-size="11" fill="#3a4256">Cinta LTO / NAS IR</text>

    <!-- Opción B -->
    <rect x="20" y="265" width="320" height="135" rx="8" fill="#f7f5f0" stroke="#d6cfbf"/>
    <g transform="translate(36,285)" stroke="#14171e" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="22" height="16" rx="2"/>
      <path d="M8 22h6M11 16v6"/>
    </g>
    <text x="68" y="298" font-size="13" font-weight="600" fill="#14171e">Opción B · VM-C custodia</text>
    <text x="36" y="328" font-size="11" fill="#3a4256">Re-attach en VM-C + disco EGRESS</text>
    <text x="36" y="348" font-size="11" fill="#3a4256">SMB hacia workstation analista</text>
    <text x="36" y="368" font-size="11" fill="#3a4256">VPC/VPN perímetro, fuera de prod</text>

    <!-- Steps -->
    <g transform="translate(0,420)">
      <circle cx="30" cy="20" r="11" fill="#3a4256"/>
      <text x="30" y="24" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">X</text>
      <text x="50" y="18" font-size="12" fill="#14171e" font-weight="600">Cadena de custodia</text>
      <text x="50" y="34" font-size="11" fill="#3a4256">Ticket: timestamp, autor, hash VMDK</text>

      <circle cx="30" cy="80" r="11" fill="#3a4256"/>
      <text x="30" y="84" text-anchor="middle" font-size="11" fill="#ffffff" font-family="JetBrains Mono, monospace">Y</text>
      <text x="50" y="78" font-size="12" fill="#14171e" font-weight="600">Cleanup VM-A</text>
      <text x="50" y="94" font-size="11" fill="#3a4256">Restore snapshot, marcar triage OK</text>
    </g>
  </g>

  <!-- Footer band -->
  <g transform="translate(60,810)">
    <line x1="0" y1="0" x2="1680" y2="0" stroke="#d6cfbf"/>
    <text x="0" y="32" font-size="12" fill="#7c7a72">Artefactos generados (todos en E:\ dentro de DFIR-OUTPUT.vmdk):</text>
    <g transform="translate(0,48)">
      <rect x="0" y="0" width="280" height="48" rx="6" fill="#ffffff" stroke="#e9e3d6"/>
      <text x="14" y="22" font-size="11" fill="#14171e" font-family="JetBrains Mono, monospace">RAM-{HOST}-{TS}.raw</text>
      <text x="14" y="38" font-size="10" fill="#7c7a72">~RAM asignada · Velocidex WinPmem</text>

      <rect x="295" y="0" width="280" height="48" rx="6" fill="#ffffff" stroke="#e9e3d6"/>
      <text x="309" y="22" font-size="11" fill="#14171e" font-family="JetBrains Mono, monospace">{HOST}-KAPE-{TS}.zip</text>
      <text x="309" y="38" font-size="10" fill="#7c7a72">~800 MB · registry, $MFT, event logs</text>

      <rect x="590" y="0" width="280" height="48" rx="6" fill="#ffffff" stroke="#e9e3d6"/>
      <text x="604" y="22" font-size="11" fill="#14171e" font-family="JetBrains Mono, monospace">*.sha256 companions</text>
      <text x="604" y="38" font-size="10" fill="#7c7a72">SHA-256 nativo .NET streaming</text>

      <rect x="885" y="0" width="280" height="48" rx="6" fill="#ffffff" stroke="#e9e3d6"/>
      <text x="899" y="22" font-size="11" fill="#14171e" font-family="JetBrains Mono, monospace">NOTES\{HOST}-NOTES-{TS}.txt</text>
      <text x="899" y="38" font-size="10" fill="#7c7a72">ransom note + contexto de la corrida</text>

      <rect x="1180" y="0" width="280" height="48" rx="6" fill="#ffffff" stroke="#e9e3d6"/>
      <text x="1194" y="22" font-size="11" fill="#14171e" font-family="JetBrains Mono, monospace">DFIR-OUTPUT.vmdk</text>
      <text x="1194" y="38" font-size="10" fill="#7c7a72">16 GB NTFS · contenedor forense</text>
    </g>
  </g>

  <!-- Footer line -->
  <g transform="translate(60,920)">
    <text x="0" y="0" font-size="11" fill="#7c7a72">KAPE-MEDIA v5.2.14 · By Cybolt, MIT License · DFIR drill flow sobre VMware ESXi 7/8</text>
    <text x="1680" y="0" text-anchor="end" font-size="11" fill="#7c7a72">Label NTFS DFIR_OUTPUT · VMDK reattach entre VMs</text>
  </g>
</svg>
