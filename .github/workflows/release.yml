name: Build ISO and publish release

# Tag v* o workflow_dispatch.
# Reconstruye staging/: descarga kape.zip desde armeria, extrae kape.exe/Targets,
# compila GUIs, descarga winpmem, overlay de iso/, genera ISO y publica Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (ej: 5.2.19)'
        required: true
        type: string

permissions:
  contents: write

env:
  KAPE_ZIP_URL: https://github.com/Beacon-Lab-IR/armeria/raw/refs/heads/main/KAPE/kape.zip
  KAPE_ZIP_SHA256: 92b687b765d384f6b238c344bed239f2eaebc8a1fb16185b969d80cac71bf892
  WINPMEM_URL: https://github.com/Velocidex/WinPmem/releases/download/v4.0.rc1/winpmem_mini_x64_rc2.exe
  WINPMEM_SHA256: a4d516b6fcaf3b5b1d4ee709ce86f8eabf1d8028b3a83101479b7568b933d21b

jobs:
  build-iso:
    name: Build ISO and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extraer version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION"

      - name: Preparar staging base (overlay Cybolt)
        run: |
          mkdir -p staging/Tools/Memory
          cp -a iso/. staging/
          # VERSION.txt: actualizar cabecera con la version del release
          {
            echo "KAPE-MEDIA-v${{ steps.get_version.outputs.VERSION }}.iso - Version ${{ steps.get_version.outputs.VERSION }}"
            echo ""
            echo "Build       : $(date -u +%Y-%m-%d)"
            tail -n +4 iso/VERSION.txt
          } > staging/VERSION.txt

      - name: Descargar kape.zip desde armeria
        run: |
          mkdir -p staging/Tools /tmp/kape-src
          curl -fsSL -o staging/Tools/kape.zip "$KAPE_ZIP_URL"
          actual=$(sha256sum staging/Tools/kape.zip | awk '{print $1}')
          if [ "$actual" != "$KAPE_ZIP_SHA256" ]; then
            echo "ERROR: kape.zip SHA-256 mismatch"
            echo "  expected: $KAPE_ZIP_SHA256"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "kape.zip OK: $actual"
          unzip -q staging/Tools/kape.zip -d /tmp/kape-src
          cp /tmp/kape-src/kape/kape.exe staging/
          cp -a /tmp/kape-src/kape/Targets staging/
          cp -a /tmp/kape-src/kape/Documentation staging/
          ls -lh staging/kape.exe staging/Tools/kape.zip

      - name: Compilar KAPE_TRIAGE_UI
        run: |
          dotnet build KapeUi/KapeUi.csproj -c Release
          cp KapeUi/bin/Release/KAPE_TRIAGE_UI.exe staging/

      - name: Compilar RAM_CAPTURE_UI
        run: |
          dotnet build RamCaptureUi/RamCaptureUi.csproj -c Release
          cp RamCaptureUi/bin/Release/RAM_CAPTURE_UI.exe staging/

      - name: Descargar winpmem
        run: |
          curl -fsSL -o staging/Tools/Memory/winpmem_mini_x64_rc2.exe "$WINPMEM_URL"
          actual=$(sha256sum staging/Tools/Memory/winpmem_mini_x64_rc2.exe | awk '{print $1}')
          if [ "$actual" != "$WINPMEM_SHA256" ]; then
            echo "ERROR: winpmem SHA-256 mismatch"
            echo "  expected: $WINPMEM_SHA256"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "winpmem OK: $actual"

      - name: Regenerar SHA256SUMS.txt
        run: |
          cd staging
          {
            echo "SHA256SUMS - KAPE-MEDIA v${{ steps.get_version.outputs.VERSION }} (build $(date -u +%Y-%m-%d))"
            echo "============================================="
            echo ""
            echo "Archivos criticos (verificar contra ISO despues de montar):"
            echo ""
            sha256sum \
              kape.exe \
              KAPE_TRIAGE_UI.exe \
              RAM_CAPTURE_UI.exe \
              KAPE_TRIAGE.cmd \
              CHECK_COMPAT.cmd \
              KAPE_TRIAGE_UI.exe.config \
              Tools/kape.zip \
              Tools/Memory/winpmem_mini_x64_rc2.exe \
              Tools/Memory/CAPTURE_RAM.cmd \
              LICENSE \
              MANUAL_OPERATIVO.txt \
              VERSION.txt
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verificar staging completo
        run: |
          missing=0
          for f in \
            staging/kape.exe \
            staging/MANUAL_OPERATIVO.txt \
            staging/Tools/kape.zip \
            staging/Tools/Memory/winpmem_mini_x64_rc2.exe \
            staging/Tools/Memory/CAPTURE_RAM.cmd \
            staging/KAPE_TRIAGE_UI.exe \
            staging/RAM_CAPTURE_UI.exe
          do
            if [ ! -e "$f" ]; then
              echo "FALTA: $f"
              missing=1
            fi
          done
          if [ ! -d staging/Targets ]; then
            echo "FALTA: staging/Targets"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "staging OK"
          du -sh staging

      - name: Instalar genisoimage
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage

      - name: Generar ISO
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ISO_NAME="KAPE-MEDIA-v${VERSION}.iso"
          mkdir -p dist
          genisoimage -R -J -joliet-long \
            -V "KAPE-MEDIA-v${VERSION}" \
            -o "dist/$ISO_NAME" \
            staging/
          ls -lh "dist/$ISO_NAME"

      - name: Calcular SHA-256 del ISO
        id: hash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ISO_NAME="KAPE-MEDIA-v${VERSION}.iso"
          ISO_SHA=$(sha256sum "dist/$ISO_NAME" | awk '{print $1}')
          echo "ISO_SHA=$ISO_SHA" >> "$GITHUB_OUTPUT"
          echo "ISO size: $(stat -c%s "dist/$ISO_NAME") bytes"
          echo "ISO SHA-256: $ISO_SHA"

      - name: Crear Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          ISO_SHA: ${{ steps.hash.outputs.ISO_SHA }}
        run: |
          ISO_PATH="dist/KAPE-MEDIA-v${VERSION}.iso"
          NOTES=$(cat <<EOF
          ISO no-booteable para adquisicion DFIR sobre VMware/Proxmox.

          ## Instalacion

          1. Subir a datastore del hipervisor (vCenter Web UI o Proxmox).
          2. Adjuntar como CD-ROM en la VM objetivo (sin red).
          3. Ejecutar \`RAM_CAPTURE_UI.exe\` y luego \`KAPE_TRIAGE_UI.exe\`.
          4. Apagar VM, mover DFIR-OUTPUT.vmdk a la siguiente VM o VM de analisis.

          ## Verificacion de integridad

          SHA-256 del ISO:

          \`\`\`
          ${ISO_SHA}
          \`\`\`

          Verificar con:

          \`\`\`bash
          shasum -a 256 KAPE-MEDIA-v${VERSION}.iso
          \`\`\`

          Codigo fuente: https://github.com/Beacon-Lab-IR/kape-media

          By Cybolt, MIT License.
          EOF
          )
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${VERSION} ya existe: subiendo asset con --clobber"
            gh release upload "v${VERSION}" "${ISO_PATH}" \
              --repo "${{ github.repository }}" --clobber
            gh release edit "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --notes "${NOTES}"
          else
            gh release create "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --title "KAPE-MEDIA v${VERSION}" \
              --notes "${NOTES}" \
              "${ISO_PATH}"
          fi

      - name: Tag en workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag ya existe"
          else
            git tag "v${{ steps.get_version.outputs.VERSION }}"
            git push origin "v${{ steps.get_version.outputs.VERSION }}"
          fi

      - name: Resumen
        if: success()
        run: |
          echo "## Release v${{ steps.get_version.outputs.VERSION }} publicada"
          echo "ISO: dist/KAPE-MEDIA-v${{ steps.get_version.outputs.VERSION }}.iso"
          echo "SHA-256: ${{ steps.hash.outputs.ISO_SHA }}"
          echo "URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.VERSION }}"
