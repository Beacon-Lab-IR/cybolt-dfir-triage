name: Build bundle and publish release

# Tag v* o workflow_dispatch.
# Reconstruye staging/: baja kape.zip (verificado por SHA-256), lo descomprime
# para dejar kape.exe/Targets/Modules/ en la raiz, baja winpmem, compila el
# wizard CYBOLT_DFIR_TRIAGE.exe, arma el bundle y publica el Release.
#
# Este repo es self-contained (solo Triage). El ISO booteable que combina
# Triage + Uploader vive en Beacon-Lab-IR/cybolt-dfir-iso.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (ej: 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  # Mirror propio de KAPE 1.3.0.2. El release oficial de EricZimmerman/KAPE
  # no expone el asset (404), asi que el proyecto lo sirve desde armeria.
  # El SHA-256 de abajo es el del zip verificado (92b687b7...).
  KAPE_ZIP_URL: https://github.com/Beacon-Lab-IR/armeria/raw/refs/heads/main/KAPE/kape.zip
  KAPE_ZIP_SHA256: 92b687b765d384f6b238c344bed239f2eaebc8a1fb16185b969d80cac71bf892
  WINPMEM_URL: https://github.com/Velocidex/WinPmem/releases/download/v4.0.rc1/winpmem_mini_x64_rc2.exe
  WINPMEM_SHA256: a4d516b6fcaf3b5b1d4ee709ce86f8eabf1d8028b3a83101479b7568b933d21b

jobs:
  build-bundle:
    name: Build bundle and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extraer version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION"

      - name: Preparar staging
        run: |
          mkdir -p staging/Tools/Memory staging/docs
          cp README.md VERSION.txt LICENSE targets-full.txt staging/
          cp docs/OPERATIVO.md staging/docs/
          # VERSION.txt: cabecera con la version del release + fecha de build
          {
            echo "CYBOLT-DFIR-TRIAGE-v${{ steps.get_version.outputs.VERSION }} - Version ${{ steps.get_version.outputs.VERSION }}"
            echo ""
            echo "Build       : $(date -u +%Y-%m-%d)"
            tail -n +4 VERSION.txt
          } > staging/VERSION.txt
          ls -la staging/

      - name: Descargar kape.zip y extraer
        run: |
          curl -fsSL -o /tmp/kape.zip "$KAPE_ZIP_URL"
          actual=$(sha256sum /tmp/kape.zip | awk '{print $1}')
          if [ "$actual" != "$KAPE_ZIP_SHA256" ]; then
            echo "ERROR: kape.zip SHA-256 mismatch"
            echo "  expected: $KAPE_ZIP_SHA256"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "kape.zip OK: $actual"
          unzip -qo /tmp/kape.zip -d /tmp/kape-src
          # Copiar TODO el contenido de kape/ (no solo 4 items): el bundle
          # tiene que llevar el arbol completo de la distribucion de KAPE
          # (kape.exe, gkape.exe, Targets/, Modules/, Documentation/,
          # ChangeLog.txt, Get-KAPEUpdate.ps1, gkape.settings). Enumerar
          # solo algunos dejaba afuera gkape.exe (63 MB) y el operador
          # perdia el GUI de KAPE.
          cp -a /tmp/kape-src/kape/. staging/
          # El kape.zip oficial trae logs de la maquina del autor de KAPE y
          # su kape.cli con paths locales. No son producto: en un bundle
          # DFIR parecen evidencia.
          rm -f staging/*_ConsoleLog.txt staging/*kape.cli
          ls -la staging/ | head -15

      - name: Descargar winpmem
        run: |
          curl -fsSL -o staging/Tools/Memory/winpmem_mini_x64_rc2.exe "$WINPMEM_URL"
          actual=$(sha256sum staging/Tools/Memory/winpmem_mini_x64_rc2.exe | awk '{print $1}')
          if [ "$actual" != "$WINPMEM_SHA256" ]; then
            echo "ERROR: winpmem SHA-256 mismatch"
            echo "  expected: $WINPMEM_SHA256"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "winpmem OK: $actual"

      - name: Compilar CYBOLT_DFIR_TRIAGE
        run: |
          dotnet build DfirTriageUi/DfirTriageUi.csproj -c Release
          cp DfirTriageUi/bin/Release/CYBOLT_DFIR_TRIAGE.exe staging/
          sha256sum staging/CYBOLT_DFIR_TRIAGE.exe

      - name: Verificar staging completo
        run: |
          missing=0
          for f in \
            staging/CYBOLT_DFIR_TRIAGE.exe \
            staging/kape.exe \
            staging/gkape.exe \
            staging/ChangeLog.txt \
            staging/Get-KAPEUpdate.ps1 \
            staging/gkape.settings \
            staging/targets-full.txt \
            staging/docs/OPERATIVO.md \
            staging/VERSION.txt \
            staging/LICENSE \
            staging/README.md \
            staging/Tools/Memory/winpmem_mini_x64_rc2.exe
          do
            if [ ! -e "$f" ]; then
              echo "FALTA: $f"
              missing=1
            fi
          done
          for d in staging/Targets staging/Modules staging/Documentation; do
            if [ ! -d "$d" ]; then
              echo "FALTA: $d"
              missing=1
            fi
          done
          # El bundle NO puede llevar los artefactos upstream de KAPE.
          junk=$(find staging -maxdepth 1 \( -name '*_ConsoleLog.txt' -o -name '*kape.cli' \) | wc -l)
          if [ "$junk" -ne 0 ]; then
            echo "FALTA: $junk artefactos upstream de KAPE en el bundle"
            find staging -maxdepth 1 \( -name '*_ConsoleLog.txt' -o -name '*kape.cli' \)
            missing=1
          fi
          # Contraste de tamano: staging completo son ~748 MB (Modules 661 +
          # gkape.exe 60 + kape.exe 7 + Targets 1.7). Si baja de 700 MB,
          # algo grande dejo de copiarse (ya paso con gkape.exe: se perdian
          # 60 MB y el bundle salia 62 MB mas chico sin avisar).
          sz=$(du -sk staging | awk '{print $1}')
          echo "    staging: ${sz} KB"
          if [ "$sz" -lt 700000 ]; then
            echo "FALTA: staging demasiado chico (${sz} KB < 700000 KB). Revisar que se copie todo kape.zip"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "staging OK"

      - name: Empaquetar ZIP
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist
          ( cd staging && zip -qr "../dist/CyboltDFIR-Triage-v${VERSION}.zip" . -x "*.DS_Store" "*/.DS_Store" )
          ls -lh "dist/CyboltDFIR-Triage-v${VERSION}.zip"

      - name: Calcular SHA-256
        id: hash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ISO_SHA=$(sha256sum "dist/CyboltDFIR-Triage-v${VERSION}.zip" | awk '{print $1}')
          echo "SHA=$ISO_SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $ISO_SHA"

      - name: Crear o actualizar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          SHA: ${{ steps.hash.outputs.SHA }}
        run: |
          ASSET="dist/CyboltDFIR-Triage-v${VERSION}.zip"
          NOTES=$(cat <<EOF
          ## CyboltDFIR Triage v${VERSION}

          Bundle de adquisicion DFIR para Windows: KAPE 1.3.0.2 + captura de
          RAM opt-in, en un solo paquete, con el wizard parametrizable.

          ### Novedades v0.4.0

          - **Link \`comando\` en paso 3.** Despliega los args KAPE (editable)
            con el set full de \`targets-full.txt\` + \`--vss\`. Reset vuelve
            al default. Si el panel esta abierto, ▶ Ejecutar usa lo editado.

          ### Novedades v0.3.2

          - **Una sola version.** Tag = ZIP = AssemblyVersion = UI
            (\`AppVersion.Current\`). Se abandona el esquema dual 0.x / 5.x.
          - Incluye los fixes de v0.3.1: deteccion del bundle junto al \`.exe\`
            (ya no exige CD-ROM/ISO) y ComboBox sin label Fixed/Removable.

          ### Novedades v0.3.1

          - **Fix: deteccion del bundle** en la carpeta del \`.exe\`.
          - **UX:** ComboBox de entrada sin "Fixed"/"Removable".

          ### Novedades v0.3.0

          - **Salida libre.** Sin busqueda por label \`DFIR_OUTPUT\`.
          - **Docs:** mockups del flujo de 5 pasos en el README.

          ### Novedades v0.2.0

          - **Wizard parametrizable.** Paso 2: disco de entrada (ComboBox,
            default \`C:\`) + carpeta de salida (TextBox + *Browse…*).
          - **Fix: \`--vss\` restaurado.** Sin el se pierden event logs bloqueados
            y estado historico de VSS.
          - **Fix: deteccion del ZIP** dentro de \`--tdest\` (no en el padre).
          - **Fix: quoting de rutas** con espacios.
          - **Fix: bundle limpio** (sin ConsoleLog / kape.cli upstream).

          ### Casos de uso

          - Triage de endpoints comprometidos (ransomware, BEC, lateral movement)
          - Adquisicion DFIR de hosts y VMs para IR
          - Captura de evidencia con cadena de custodia
          - Recoleccion de artefactos de usuario (browser, email, RMM, USB)
          - Analisis de actividad sospechosa con VSS / Windows.old

          ### Componentes

          - \`CYBOLT_DFIR_TRIAGE.exe\` — wizard unificado de 5 pasos (KAPE + RAM capture opt-in)
          - \`kape.exe\` + \`Targets/\` (657 .tkape) + \`Modules/\` (KAPE 1.3.0.2)
          - \`Tools/Memory/winpmem_mini_x64_rc2.exe\` — captura de RAM
          - \`targets-full.txt\` — lista de targets DFIR (filtrado defensivo: los que
            no existen en \`Targets/\` se skipean en vez de romper la corrida)

          ### Sistemas operativos soportados

          Windows 7 SP1 / Server 2008 R2 en adelante (requiere .NET Framework 4.5.2+).

          ### Plataformas

          VMware vSphere / ESXi · Proxmox VE · Hyper-V / Windows Server ·
          XenServer / Citrix · KVM / oVirt / Nutanix · host fisico con USB

          ### Flujo operativo

          1. Descomprimir el ZIP en un medio writable (USB o disco).
          2. En el equipo objetivo: \`CYBOLT_DFIR_TRIAGE.exe\` como Administrador (UAC forzado).
          3. Paso 2: elegir **disco de entrada** y **carpeta de salida** (*Browse…*).
          4. Paso 3: KapeTriage con \`--vss\`.
          5. Paso 4 (opcional, default OFF): captura de RAM con winpmem.
          6. Apagar el equipo, retirar el medio con la evidencia y subirla con el uploader.

          ### Verificacion de integridad

          | Artefacto | Tamano | SHA-256 |
          |---|---|---|
          | \`CyboltDFIR-Triage-v${VERSION}.zip\` | $(stat -c%s "${ASSET}" 2>/dev/null || stat -f%z "${ASSET}") bytes | \`${SHA}\` |

          \`\`\`sh
          shasum -a 256 CyboltDFIR-Triage-v${VERSION}.zip
          \`\`\`

          ### Variantes (ecosistema CyboltDFIR)

          - [cybolt-dfir-uploader](https://github.com/Beacon-Lab-IR/cybolt-dfir-uploader) — subidor standalone (S3/FTP/SFTP/SMB)
          - [cybolt-dfir-iso](https://github.com/Beacon-Lab-IR/cybolt-dfir-iso) — ISO booteable que combina Triage + Uploader

          Codigo fuente: https://github.com/Beacon-Lab-IR/cybolt-dfir-triage

          By Cybolt, MIT License.
          EOF
          )
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${VERSION} ya existe: --clobber"
            gh release upload "v${VERSION}" "${ASSET}" --repo "${{ github.repository }}" --clobber
            gh release edit "v${VERSION}" --repo "${{ github.repository }}" --notes "${NOTES}"
          else
            gh release create "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --title "CyboltDFIR Triage v${VERSION}" \
              --notes "${NOTES}" \
              "${ASSET}"
          fi

      - name: Tag en workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag ya existe"
          else
            git tag "v${{ steps.get_version.outputs.VERSION }}"
            git push origin "v${{ steps.get_version.outputs.VERSION }}"
          fi

      - name: Resumen
        if: success()
        run: |
          echo "## Release v${{ steps.get_version.outputs.VERSION }} publicada"
          echo "Bundle : dist/CyboltDFIR-Triage-v${{ steps.get_version.outputs.VERSION }}.zip"
          echo "SHA-256: ${{ steps.hash.outputs.SHA }}"
          echo "URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.VERSION }}"
