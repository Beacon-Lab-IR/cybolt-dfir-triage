name: Build bundle and publish release

# Tag v* o workflow_dispatch.
# Reconstruye staging/: baja kape.zip (verificado por SHA-256), lo descomprime
# para dejar kape.exe/Targets/Modules/ en la raiz, baja winpmem, compila el
# wizard CYBOLT_DFIR_TRIAGE.exe, arma el bundle y publica el Release.
#
# Este repo es self-contained (solo Triage). El ISO booteable que combina
# Triage + Uploader vive en Beacon-Lab-IR/cybolt-dfir-iso.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (ej: 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  KAPE_ZIP_URL: https://github.com/EricZimmerman/KAPE/releases/download/v1.3.0.2/kape.zip
  KAPE_ZIP_SHA256: 92b687b765d384f6b238c344bed239f2eaebc8a1fb16185b969d80cac71bf892
  WINPMEM_URL: https://github.com/Velocidex/WinPmem/releases/download/v4.0.rc1/winpmem_mini_x64_rc2.exe
  WINPMEM_SHA256: a4d516b6fcaf3b5b1d4ee709ce86f8eabf1d8028b3a83101479b7568b933d21b

jobs:
  build-bundle:
    name: Build bundle and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extraer version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION"

      - name: Preparar staging
        run: |
          mkdir -p staging/Tools/Memory
          cp README.md VERSION.txt LICENSE targets-full.txt staging/
          # VERSION.txt: cabecera con la version del release + fecha de build
          {
            echo "CYBOLT-DFIR-TRIAGE-v${{ steps.get_version.outputs.VERSION }} - Version ${{ steps.get_version.outputs.VERSION }}"
            echo ""
            echo "Build       : $(date -u +%Y-%m-%d)"
            tail -n +4 VERSION.txt
          } > staging/VERSION.txt
          ls -la staging/

      - name: Descargar kape.zip y extraer
        run: |
          curl -fsSL -o /tmp/kape.zip "$KAPE_ZIP_URL"
          actual=$(sha256sum /tmp/kape.zip | awk '{print $1}')
          if [ "$actual" != "$KAPE_ZIP_SHA256" ]; then
            echo "ERROR: kape.zip SHA-256 mismatch"
            echo "  expected: $KAPE_ZIP_SHA256"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "kape.zip OK: $actual"
          unzip -qo /tmp/kape.zip -d /tmp/kape-src
          cp /tmp/kape-src/kape/kape.exe staging/
          cp -a /tmp/kape-src/kape/Targets staging/
          cp -a /tmp/kape-src/kape/Modules staging/
          cp -a /tmp/kape-src/kape/Documentation staging/
          # El kape.zip oficial trae logs de la maquina del autor de KAPE y
          # su kape.cli con paths locales. No son producto: en un bundle
          # DFIR parecen evidencia.
          rm -f staging/*_ConsoleLog.txt staging/*.kape.cli
          ls -la staging/kape.exe staging/Targets | head -5

      - name: Descargar winpmem
        run: |
          curl -fsSL -o staging/Tools/Memory/winpmem_mini_x64_rc2.exe "$WINPMEM_URL"
          actual=$(sha256sum staging/Tools/Memory/winpmem_mini_x64_rc2.exe | awk '{print $1}')
          if [ "$actual" != "$WINPMEM_SHA256" ]; then
            echo "ERROR: winpmem SHA-256 mismatch"
            echo "  expected: $WINPMEM_SHA256"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "winpmem OK: $actual"

      - name: Compilar CYBOLT_DFIR_TRIAGE
        run: |
          dotnet build DfirTriageUi/DfirTriageUi.csproj -c Release
          cp DfirTriageUi/bin/Release/CYBOLT_DFIR_TRIAGE.exe staging/
          sha256sum staging/CYBOLT_DFIR_TRIAGE.exe

      - name: Verificar staging completo
        run: |
          missing=0
          for f in \
            staging/CYBOLT_DFIR_TRIAGE.exe \
            staging/kape.exe \
            staging/targets-full.txt \
            staging/VERSION.txt \
            staging/LICENSE \
            staging/README.md \
            staging/Tools/Memory/winpmem_mini_x64_rc2.exe
          do
            if [ ! -e "$f" ]; then
              echo "FALTA: $f"
              missing=1
            fi
          done
          if [ ! -d staging/Targets ]; then
            echo "FALTA: staging/Targets"
            missing=1
          fi
          if [ ! -d staging/Modules ]; then
            echo "FALTA: staging/Modules"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "staging OK"
          du -sh staging

      - name: Empaquetar ZIP
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist
          ( cd staging && zip -qr "../dist/CyboltDFIR-Triage-v${VERSION}.zip" . -x "*.DS_Store" "*/.DS_Store" )
          ls -lh "dist/CyboltDFIR-Triage-v${VERSION}.zip"

      - name: Calcular SHA-256
        id: hash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ISO_SHA=$(sha256sum "dist/CyboltDFIR-Triage-v${VERSION}.zip" | awk '{print $1}')
          echo "SHA=$ISO_SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $ISO_SHA"

      - name: Crear o actualizar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          SHA: ${{ steps.hash.outputs.SHA }}
        run: |
          ASSET="dist/CyboltDFIR-Triage-v${VERSION}.zip"
          NOTES=$(cat <<EOF
          Bundle de adquisicion DFIR **CyboltDFIR Triage v${VERSION}**.

          Wizard \`CYBOLT_DFIR_TRIAGE.exe\` (KAPE 1.3.0.2 + RAM capture opt-in),
          parametrizable: se elige el disco de entrada y la carpeta de salida.

          ## Instalacion

          1. Descomprimir el ZIP en un medio writable (USB o disco).
          2. En el equipo objetivo: ejecutar \`CYBOLT_DFIR_TRIAGE.exe\` como
             Administrador (UAC forzado).
          3. Paso 2 del wizard: elegir **disco de entrada** (default \`C:\`) y
             **carpeta de salida** (boton *Browse*). Default autodetectado:
             disco con label \`DFIR_OUTPUT\`, o primer disco removible.
          4. Paso 3: KapeTriage con el set de targets de \`targets-full.txt\`,
             con \`--vss\` (incluye Volume Shadow Copies).
          5. Paso 4 (opcional, default OFF): captura de RAM con winpmem.
          6. Apagar el equipo, retirar el medio con la evidencia y subirla con
             el uploader standalone.

          ## Verificacion de integridad

          SHA-256 del bundle:

          \`\`\`
          ${SHA}
          \`\`\`

          \`\`\`sh
          shasum -a 256 CyboltDFIR-Triage-v${VERSION}.zip
          \`\`\`

          ## Variantes

          - [cybolt-dfir-uploader](https://github.com/Beacon-Lab-IR/cybolt-dfir-uploader) — subidor standalone (S3/FTP/SFTP/SMB)
          - [cybolt-dfir-iso](https://github.com/Beacon-Lab-IR/cybolt-dfir-iso) — ISO booteable que combina Triage + Uploader

          Codigo fuente: https://github.com/Beacon-Lab-IR/cybolt-dfir-triage

          By Cybolt, MIT License.
          EOF
          )
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${VERSION} ya existe: --clobber"
            gh release upload "v${VERSION}" "${ASSET}" --repo "${{ github.repository }}" --clobber
            gh release edit "v${VERSION}" --repo "${{ github.repository }}" --notes "${NOTES}"
          else
            gh release create "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --title "CyboltDFIR Triage v${VERSION}" \
              --notes "${NOTES}" \
              "${ASSET}"
          fi

      - name: Tag en workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag ya existe"
          else
            git tag "v${{ steps.get_version.outputs.VERSION }}"
            git push origin "v${{ steps.get_version.outputs.VERSION }}"
          fi

      - name: Resumen
        if: success()
        run: |
          echo "## Release v${{ steps.get_version.outputs.VERSION }} publicada"
          echo "Bundle : dist/CyboltDFIR-Triage-v${{ steps.get_version.outputs.VERSION }}.zip"
          echo "SHA-256: ${{ steps.hash.outputs.SHA }}"
          echo "URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.VERSION }}"
