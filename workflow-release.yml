name: Build ISO and publish release

# Este workflow se dispara cuando se pushea un tag v* al repo principal.
# Compila las dos GUIs, genera el ISO, calcula SHA-256, y crea un Release
# en el repo de binarios (BeaconLab-IR/kape-media-releases) con el ISO
# adjunto y el SHA-256 en las notas.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (ej: 5.2.18)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-iso:
    name: Build ISO and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar KAPE_TRIAGE_UI
        run: |
          dotnet build KapeUi/KapeUi.csproj -c Release
          mkdir -p staging
          cp KapeUi/bin/Release/KAPE_TRIAGE_UI.exe staging/

      - name: Compilar RAM_CAPTURE_UI
        run: |
          dotnet build RamCaptureUi/RamCaptureUi.csproj -c Release
          cp RamCaptureUi/bin/Release/RAM_CAPTURE_UI.exe staging/

      - name: Descargar winpmem
        run: |
          mkdir -p staging/Tools/Memory
          curl -fsSL -o staging/Tools/Memory/winpmem_mini_x64_rc2.exe \
            "https://github.com/Velocidex/WinPmem/releases/download/v4.0.rc1/winpmem_mini_x64_rc2.exe"

      - name: Verificar SHA-256 winpmem
        run: |
          expected="a4d516b6fcaf3b5b1d4ee709ce86f8eabf1d8028b3a83101479b7568b933d21b"
          actual=$(sha256sum staging/Tools/Memory/winpmem_mini_x64_rc2.exe | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: winpmem SHA-256 mismatch"
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "winpmem OK: $actual"

      - name: Extraer version del tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building v$VERSION"

      - name: Instalar herramientas de build ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage xorriso

      - name: Generar ISO
        run: |
          ISO_NAME="KAPE-MEDIA-v${{ steps.get_version.outputs.VERSION }}.iso"
          genisoimage -R -J -joliet-long \
            -V "KAPE-MEDIA-v${{ steps.get_version.outputs.VERSION }}" \
            -o "dist/$ISO_NAME" \
            staging/
          ls -lh "dist/$ISO_NAME"

      - name: Calcular SHA-256 del ISO
        id: hash
        run: |
          ISO_NAME="KAPE-MEDIA-v${{ steps.get_version.outputs.VERSION }}.iso"
          ISO_SHA=$(sha256sum "dist/$ISO_NAME" | awk '{print $1}')
          echo "ISO_SHA=$ISO_SHA" >> $GITHUB_OUTPUT
          echo "ISO size: $(stat -c%s dist/$ISO_NAME) bytes"
          echo "ISO SHA-256: $ISO_SHA"

      - name: Crear Release en repo de binarios
        env:
          GH_TOKEN: ${{ secrets.BEACONLAB_RELEASES_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          ISO_SHA: ${{ steps.hash.outputs.ISO_SHA }}
          ISO_PATH: dist/KAPE-MEDIA-v${{ steps.get_version.outputs.VERSION }}.iso
        run: |
          NOTES=$(cat <<EOF
          ## KAPE-MEDIA v${VERSION}

          ISO no-booteable para adquisicion DFIR sobre VMware/Proxmox.

          ### Instalacion
          1. Subir a datastore del hipervisor (vCenter Web UI o API).
          2. Adjuntar como CD-ROM en la VM objetivo (sin red).
          3. Ejecutar \`RAM_CAPTURE_UI.exe\` y luego \`KAPE_TRIAGE_UI.exe\`.
          4. Apagar VM, mover DFIR-OUTPUT.vmdk a la siguiente VM o VM de analisis.

          ### Verificacion de integridad
          SHA-256 del ISO:

          \`\`\`
          ${ISO_SHA}
          \`\`\`

          Verificar con:
          \`\`\`bash
          shasum -a 256 KAPE-MEDIA-v${VERSION}.iso
          \`\`\`

          Ver README.md para instrucciones completas.

          By Cybolt, MIT License.
          EOF
          )
          gh release create "v${VERSION}" \
            --repo "${{ secrets.BEACONLAB_RELEASES_REPO }}" \
            --title "KAPE-MEDIA v${VERSION}" \
            --notes "${NOTES}" \
            "${ISO_PATH}"
        env:
          GH_TOKEN: ${{ secrets.BEACONLAB_RELEASES_TOKEN }}
          RELEASES_REPO: ${{ secrets.BEACONLAB_RELEASES_REPO }}

      - name: Tag release en repo principal
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v${{ steps.get_version.outputs.VERSION }}"
          git push origin "v${{ steps.get_version.outputs.VERSION }}"

      - name: Resumen
        if: success()
        run: |
          echo "## Release v${{ steps.get_version.outputs.VERSION }} publicada"
          echo "ISO: dist/KAPE-MEDIA-v${{ steps.get_version.outputs.VERSION }}.iso"
          echo "SHA-256: ${{ steps.hash.outputs.ISO_SHA }}"
          echo "Repositorio: ${{ secrets.BEACONLAB_RELEASES_REPO }}"
