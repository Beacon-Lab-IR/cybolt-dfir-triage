<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="420" fill="#f7f8fa"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1a1a1a">CYBOLT DFIR Triage - flujo del wizard</text>
  <text x="40" y="68" font-size="13" fill="#555">5 paneles - un Panel visible a la vez - bundle ZIP (no ISO)</text>

  <rect x="40" y="100" width="200" height="250" rx="6" fill="#fff" stroke="#cfd4dc"/>
  <rect x="40" y="100" width="200" height="36" rx="6" fill="#2b5a9e"/>
  <rect x="40" y="118" width="200" height="18" fill="#2b5a9e"/>
  <text x="54" y="124" font-size="13" font-weight="700" fill="#fff">1. Bienvenida</text>
  <text x="54" y="160" font-size="12" fill="#333">Opciones iniciales</text>
  <rect x="54" y="176" width="12" height="12" fill="#fff" stroke="#555"/>
  <text x="72" y="187" font-size="11" fill="#333">Capturar RAM (OFF)</text>
  <rect x="54" y="200" width="12" height="12" fill="#fff" stroke="#555"/>
  <text x="72" y="211" font-size="11" fill="#333">cmd.exe wrapper</text>
  <text x="54" y="250" font-size="11" fill="#666">Explica KapeTriage</text>
  <text x="54" y="268" font-size="11" fill="#666">+ RAM opt-in</text>

  <path d="M250 225 L268 225 L262 219 M268 225 L262 231" stroke="#2b5a9e" stroke-width="2" fill="none"/>

  <rect x="280" y="100" width="200" height="250" rx="6" fill="#fff" stroke="#2b5a9e" stroke-width="2"/>
  <rect x="280" y="100" width="200" height="36" rx="6" fill="#2b5a9e"/>
  <rect x="280" y="118" width="200" height="18" fill="#2b5a9e"/>
  <text x="294" y="124" font-size="13" font-weight="700" fill="#fff">2. Deteccion</text>
  <text x="294" y="160" font-size="12" fill="#333">Parametros</text>
  <text x="294" y="186" font-size="11" fill="#333">Entrada: ComboBox</text>
  <rect x="294" y="196" width="150" height="18" fill="#f5f5f5" stroke="#999"/>
  <text x="300" y="209" font-size="10" fill="#111">C:\  [Windows]</text>
  <text x="294" y="236" font-size="11" fill="#333">Salida: TextBox + Browse</text>
  <rect x="294" y="246" width="110" height="18" fill="#f5f5f5" stroke="#999"/>
  <text x="300" y="259" font-size="10" fill="#111">E:\DFIR-OUTPUT</text>
  <rect x="408" y="246" width="48" height="18" fill="#e8e8e8" stroke="#999"/>
  <text x="412" y="259" font-size="9" fill="#111">Browse</text>
  <text x="294" y="290" font-size="10" fill="#2b5a9e">crea carpeta si no existe</text>
  <text x="294" y="308" font-size="10" fill="#666">sin label DFIR_OUTPUT</text>

  <path d="M490 225 L508 225 L502 219 M508 225 L502 231" stroke="#2b5a9e" stroke-width="2" fill="none"/>

  <rect x="520" y="100" width="200" height="250" rx="6" fill="#fff" stroke="#cfd4dc"/>
  <rect x="520" y="100" width="200" height="36" rx="6" fill="#2b5a9e"/>
  <rect x="520" y="118" width="200" height="18" fill="#2b5a9e"/>
  <text x="534" y="124" font-size="13" font-weight="700" fill="#fff">3. KapeTriage</text>
  <text x="534" y="160" font-size="12" fill="#333">Adquisicion FS</text>
  <rect x="534" y="180" width="160" height="28" rx="3" fill="#2e7d32"/>
  <text x="552" y="199" font-size="12" font-weight="700" fill="#fff">Ejecutar KapeTriage</text>
  <rect x="534" y="222" width="160" height="10" fill="#e6e6e6" stroke="#bbb"/>
  <rect x="534" y="222" width="90" height="10" fill="#2b5a9e"/>
  <text x="534" y="258" font-size="11" fill="#666">KAPE 1.3.0.2 + --vss</text>
  <text x="534" y="276" font-size="11" fill="#666">ZIP en carpeta salida</text>

  <path d="M730 225 L748 225 L742 219 M748 225 L742 231" stroke="#2b5a9e" stroke-width="2" fill="none"/>

  <rect x="760" y="100" width="200" height="250" rx="6" fill="#fff" stroke="#cfd4dc"/>
  <rect x="760" y="100" width="200" height="36" rx="6" fill="#2b5a9e"/>
  <rect x="760" y="118" width="200" height="18" fill="#2b5a9e"/>
  <text x="774" y="124" font-size="13" font-weight="700" fill="#fff">4. RAM Capture</text>
  <text x="774" y="160" font-size="12" fill="#333">winpmem (opt-in)</text>
  <rect x="774" y="180" width="160" height="28" rx="3" fill="#2e7d32"/>
  <text x="792" y="199" font-size="12" font-weight="700" fill="#fff">Ejecutar captura RAM</text>
  <text x="774" y="240" font-size="11" fill="#a65c00">Se omite si el checkbox</text>
  <text x="774" y="256" font-size="11" fill="#a65c00">del paso 1 esta OFF</text>
  <text x="774" y="288" font-size="11" fill="#666">.raw en salida</text>

  <path d="M970 225 L988 225 L982 219 M988 225 L982 231" stroke="#2b5a9e" stroke-width="2" fill="none"/>

  <rect x="1000" y="100" width="240" height="250" rx="6" fill="#fff" stroke="#cfd4dc"/>
  <rect x="1000" y="100" width="240" height="36" rx="6" fill="#2b5a9e"/>
  <rect x="1000" y="118" width="240" height="18" fill="#2b5a9e"/>
  <text x="1014" y="124" font-size="13" font-weight="700" fill="#fff">5. Resumen</text>
  <text x="1014" y="160" font-size="12" fill="#333">Paths + SHA-256</text>
  <text x="1014" y="188" font-size="11" fill="#333">Entrada: C:\</text>
  <text x="1014" y="206" font-size="11" fill="#333">Salida: E:\DFIR-OUTPUT</text>
  <text x="1014" y="232" font-size="11" fill="#666">HOST-KAPE-....zip</text>
  <text x="1014" y="248" font-size="10" font-family="Consolas, monospace" fill="#2e7d32">sha256: a3f1...9c2e</text>
  <text x="1014" y="274" font-size="11" fill="#666">RAM-HOST-....raw</text>
  <text x="1014" y="290" font-size="10" font-family="Consolas, monospace" fill="#2e7d32">sha256: 7b88...d014</text>
  <text x="1014" y="322" font-size="11" fill="#2e7d32">Listo para entregar</text>

  <text x="40" y="390" font-size="12" fill="#777">Mockup de documentacion (no screenshot E2E). El .exe real es WinForms .NET Framework 4.5.2.</text>
